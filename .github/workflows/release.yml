# Builds and publishes Ezra App Mini installers whenever a version tag
# (v0.2.0, v0.3.1, etc.) is pushed. Publishing target is GitHub Releases on
# this repo, matching the "publish" block in Ezra App Mini/package.json --
# electron-updater on installed copies checks that same Releases feed.
#
# Mac builds are ad-hoc self-signed (see the "identity": null in
# package.json's build.mac config), not signed with a paid Apple Developer
# ID -- users installing the Mac build will need to right-click > Open (or
# System Settings > Privacy & Security > Open Anyway) the first time, since
# it isn't notarized. That's a deliberate cost tradeoff, not an oversight.
#
# Two-stage build/publish, NOT electron-builder's own --publish. An earlier
# version had each OS job call `electron-builder --publish always` directly,
# which makes each job independently ask the GitHub API "does a release for
# this tag exist yet?" before creating one. Even with the matrix forced to
# run strictly sequentially (max-parallel: 1, confirmed via job timestamps),
# this still produced two separate draft releases for the same tag -- the
# GitHub Releases API has enough read-after-write lag that a check running
# seconds after the other job's release-create call can still miss it.
# Splitting into a `build` stage (just packages, no publishing, one artifact
# upload per OS -- no Releases API involved at all) and a single non-matrix
# `publish` stage (downloads both artifacts, creates the release once) means
# only one process ever touches the Releases API for a given tag, so the
# race is structurally impossible rather than just narrowed.

name: Release

"on":
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: win-dist
          - os: macos-latest
            script: dist:mac
            artifact: mac-dist
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: "Ezra App Mini"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build (no publish)
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Installer + updater-feed files only -- not the win-unpacked/
          # mac-unpacked staging folders, which are the packaged app's raw
          # contents, not release assets.
          path: |
            Ezra App Mini/dist/*.exe
            Ezra App Mini/dist/*.exe.blockmap
            Ezra App Mini/dist/*.dmg
            Ezra App Mini/dist/*.dmg.blockmap
            Ezra App Mini/dist/*.zip
            Ezra App Mini/dist/*.zip.blockmap
            Ezra App Mini/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Create single combined release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
