<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ezra Catnip Sequence Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    position: relative;
  }

  #sprite {
    image-rendering: pixelated;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 60vw;
    max-height: 60vh;
  }

  #bowl {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 180px;
  }

  #speedBar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 999px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #fff;
    user-select: none;
    z-index: 10;
  }

  #speedBar input[type="range"] {
    width: 200px;
  }

  #clipLabel {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #333;
    background: rgba(255, 255, 255, 0.7);
    padding: 6px 14px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <img id="bowl" src="Props/Food Tray/transparent/bowl_full.png" alt="bowl">
  <img id="sprite" src="Poses/Eat/transparent/1.png" alt="Ezra">
  <div id="clipLabel">eat</div>

  <div id="speedBar">
    <span>Speed</span>
    <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="1">
    <span id="speedLabel">1.00x</span>
  </div>

  <script>
    function buildFrames(path, count) {
      const frames = [];
      for (let i = 1; i <= count; i++) frames.push(`${path}/${i}.png`);
      return frames;
    }

    // frameDurations (ms), when present, overrides fps per-frame for that clip.
    // A duration of Infinity freezes on that frame (terminal state for this test).
    const clips = [
      { name: "eat", frames: buildFrames("Poses/Eat/transparent", 2), fps: 2, repeat: 6 },
      {
        name: "look-at-viewer",
        frames: ["Poses/Catnip/transparent/4.png"],
        frameDurations: [3000],
        repeat: 1,
      },
      { name: "stretch", frames: buildFrames("Poses/Stretch/transparent", 3), fps: 6, repeat: 1 },
      {
        name: "catnip-roll",
        frames: ["Poses/Catnip/transparent/1.png", "Poses/Catnip/transparent/2.png"],
        fps: 3,
        repeat: 5,
      },
      {
        name: "catnip-settle",
        frames: ["Poses/Catnip/transparent/3.png"],
        frameDurations: [1500],
        repeat: 1,
      },
      {
        name: "sleep-settle",
        frames: buildFrames("Poses/Sleep/transparent", 2),
        frameDurations: [3000, Infinity],
        repeat: 1,
      },
    ];

    const img = document.getElementById("sprite");
    const bowl = document.getElementById("bowl");
    const clipLabel = document.getElementById("clipLabel");
    let clipIndex = 0;
    let frameIndex = 0;
    let repeatCount = 0;

    let speed = 1;
    const speedSlider = document.getElementById("speedSlider");
    const speedLabel = document.getElementById("speedLabel");
    speedSlider.addEventListener("input", () => {
      speed = parseFloat(speedSlider.value);
      speedLabel.textContent = `${speed.toFixed(2)}x`;
    });

    function tick() {
      const clip = clips[clipIndex];
      img.src = clip.frames[frameIndex];
      clipLabel.textContent = clip.name;

      const baseDuration = clip.frameDurations ? clip.frameDurations[frameIndex] : 1000 / clip.fps;

      frameIndex++;
      if (frameIndex >= clip.frames.length) {
        frameIndex = 0;
        repeatCount++;
        if (repeatCount >= clip.repeat) {
          repeatCount = 0;
          const finishedClipName = clip.name;
          if (clipIndex < clips.length - 1) clipIndex++;
          if (finishedClipName === "eat") {
            bowl.src = "Props/Food Tray/transparent/bowl_empty.png";
          }
        }
      }

      if (baseDuration === Infinity) return; // freeze here
      setTimeout(tick, baseDuration / speed);
    }

    tick();
  </script>
</body>
</html>
