<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ezra Mini</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    bottom: 2px; /* ground line now = top of the taskbar (window uses workArea) */
    width: 220px;
    height: 220px;
    -webkit-user-select: none;
    user-select: none;
    z-index: 1; /* draw over the cushion, not behind it */
  }

  /* Static resting spot at her home corner -- placeholder maroon rectangle
     for now, always visible regardless of what she's doing. Cat's home spot
     is flush to the edge (HOME_MARGIN 0 in engine.js); cushion is offset an
     extra 28px (~0.75cm at 96 DPI) further left than her exact spot, by
     request -- don't resync these two. */
  #cushion {
    position: fixed;
    right: 28px;
    bottom: 2px;
    width: 160px;
    height: 16px;
    background: #6b1f2a;
    border-radius: 8px;
    pointer-events: none;
  }

  #sprite {
    position: absolute;
    left: 0;
    top: 0;
    width: 220px;
    /* Deliberately NOT image-rendering: pixelated -- this is smooth vector
       art, not pixel art. Nearest-neighbor scaling jagged the edges when
       tried earlier; default (smooth) scaling is correct for this art. */
  }

  /* Rough head-area anchor for sit_02 look-up -- tune once visible. */
  #flies {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 60px;
    height: 60px;
    pointer-events: none;
    display: none;
  }
  #flies .fly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #333;
    transition: left 0.1s ease-out, top 0.1s ease-out;
  }
</style>
</head>
<body>
  <div id="cushion"></div>
  <div id="stage">
    <img id="sprite" src="../assets/ezra/sit_01.png" alt="Ezra">
    <div id="flies">
      <div class="fly" id="fly1"></div>
      <div class="fly" id="fly2"></div>
    </div>
  </div>
  <script src="engine.js"></script>
</body>
</html>
