<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ezra</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }

  #bowl {
    position: fixed;
    left: 24px;
    bottom: 24px;
    width: 160px;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }

  #sprite {
    position: fixed;
    bottom: 60px;
    width: 220px;
    -webkit-user-select: none;
    user-select: none;
    /* Deliberately NOT image-rendering: pixelated -- this is smooth vector
       art, not pixel art. Nearest-neighbor scaling jagged the edges when
       tried earlier; default (smooth) scaling is correct for this art. */
  }
</style>
</head>
<body>
  <img id="bowl" src="../assets/ezra/prop_bowl_empty.png" alt="bowl">
  <img id="sprite" src="../assets/ezra/idle_01.png" alt="Ezra">
  <script src="engine.js"></script>
</body>
</html>
