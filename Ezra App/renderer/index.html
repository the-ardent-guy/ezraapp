<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ezra</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    bottom: 2px; /* ground line now = top of the taskbar (window uses workArea) */
    width: 220px;
    height: 220px;
    -webkit-user-select: none;
    user-select: none;
    z-index: 1; /* draw over the cushion, not behind it */
  }

  /* Static resting spot at her home corner -- placeholder maroon rectangle
     for now, always visible regardless of what she's doing. right: 20px
     matches HOME_MARGIN in engine.js -- keep these in sync if it changes. */
  #cushion {
    position: fixed;
    right: 20px;
    bottom: 2px;
    width: 160px;
    height: 16px;
    background: #6b1f2a;
    border-radius: 8px;
    pointer-events: none;
  }

  #sprite {
    position: absolute;
    left: 0;
    top: 0;
    width: 220px;
    /* Deliberately NOT image-rendering: pixelated -- this is smooth vector
       art, not pixel art. Nearest-neighbor scaling jagged the edges when
       tried earlier; default (smooth) scaling is correct for this art. */
  }

  /* Rough head-area anchor for sit_01/sit_02/sit_blink -- tune once visible. */
  #flies {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 60px;
    height: 60px;
    pointer-events: none;
    display: none;
  }
  #flies .fly {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #333;
    transition: left 0.1s ease-out, top 0.1s ease-out;
  }

  /* Anchored near sleep_02's ear tips (measured ~x250-430,y520 on the
     1000px canvas -> ~55px,85px at the 220px display scale). Tune once
     visible -- same caveat as the #flies anchor above. */
  #zzz {
    position: absolute;
    left: 55px;
    top: 85px;
    pointer-events: none;
    display: none;
    font-family: sans-serif;
    font-weight: bold;
    color: #6a7fa8;
    text-shadow: 0 0 2px rgba(255, 255, 255, 0.6);
    animation: zzz-float 2.5s ease-in-out infinite;
  }
  @keyframes zzz-float {
    0% { opacity: 0; transform: translateY(0); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
  }
</style>
</head>
<body>
  <div id="cushion"></div>
  <div id="stage">
    <img id="sprite" src="../assets/ezra/idle_02.png" alt="Ezra">
    <div id="flies">
      <div class="fly" id="fly1"></div>
      <div class="fly" id="fly2"></div>
    </div>
    <div id="zzz">Z</div>
  </div>
  <script src="engine.js"></script>
</body>
</html>
